name: LearnSphere quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend-sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m mypy app
        working-directory: backend
      - run: python -m pytest -q --junitxml=../backend-results.xml
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m app.cli seed-permissions
        working-directory: backend
      - run: python -m pip_audit -r backend/requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.os }}
          path: backend-results.xml
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: learnsphere_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d learnsphere_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test_user:isolated-ci-only@localhost:5432/learnsphere_test
  frontend-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.dev.yml build
      - run: docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8080/api/v1/health
      - run: docker compose -f docker-compose.dev.yml exec -T backend python -m app.cli seed-demo
      - run: docker compose -f docker-compose.dev.yml exec -T backend python -m alembic check
      - run: docker compose -f docker-compose.dev.yml logs --tail 100
        if: always()
      - run: docker compose -f docker-compose.dev.yml down
        if: always()
