name: learnsphere-enterprise
x-app: &app
  build: ./backend
  image: learnsphere-backend:1.0.0
  env_file: .env.production
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    DEMO_ENABLED: 'false'
    STORAGE_PATH: /app/storage
  volumes:
    - course_files:/app/storage
  networks: [app]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
  migrate:
    <<: *app
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
    restart: 'no'
    healthcheck: {disable: true}
  backend:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
  worker:
    <<: *app
    command: [python, -m, app.tasks.scheduler]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [CMD, python, -m, app.tasks.scheduler, --health]
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: learnsphere-frontend:1.0.0
    ports: ['127.0.0.1:8080:8080']
    networks: [app]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
networks:
  app: {}
volumes:
  postgres_data: {}
  course_files: {}
