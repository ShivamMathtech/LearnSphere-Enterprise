[tool.pytest.ini_options]
pythonpath = ['.']
testpaths = ['tests']
addopts = '-ra'
[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F']
[tool.mypy]
python_version = '3.12'
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"] # Test database environment must be set before application imports.
